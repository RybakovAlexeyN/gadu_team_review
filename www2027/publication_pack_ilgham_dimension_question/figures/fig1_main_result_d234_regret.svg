<title id="title">Figure 1. Family retirement saves regret against the matched staged policy, but not against direct geometric UCB.</title>
<desc id="desc">For d=2,3,4 strong gap q=.75 at T=20,000, average cumulative latent pseudo-regret: staged no retirement 4151.6, staged with certified retirement 1605.8, direct geometry-aware UCB 1205.8. Six seeds. Lower is better.</desc>
