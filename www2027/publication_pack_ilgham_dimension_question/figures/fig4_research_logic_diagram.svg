<text x="650" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#3a5874">Stage 1 → candidate certificate → Stage 2</text>
<line x1="650" y1="396" x2="650" y2="438" stroke="#58748e" stroke-width="3" marker-end="url(#arrow)"/>
