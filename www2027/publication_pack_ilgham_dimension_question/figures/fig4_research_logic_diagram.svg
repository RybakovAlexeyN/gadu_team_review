<rect width="1300" height="800" fill="white"/>
<text x="50" y="60" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#1b3149">What did we actually test?</text>
<text x="50" y="95" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5f7187">Research logic and claim boundary — conceptual figure (not empirical data)</text>
