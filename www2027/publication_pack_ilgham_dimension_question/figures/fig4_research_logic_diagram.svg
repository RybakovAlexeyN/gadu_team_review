<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" role="img" aria-labelledby="title desc">
<title id="title">Figure 4. Which mechanism is supported by the experiments and which author-algorithm claim is still open.</title>
<desc id="desc">Conceptual diagram of Ilgham's question, the family dimension setting, Search/Compare/certificate, matching staged retirement ablation, strong direct comparator, and limitations. Not a synthetic trajectory result.</desc>
