<text x="339" y="579" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#216e56">4,151.6 → 1,605.8 (−61.3%)</text>
<rect x="683" y="484" width="559" height="134" rx="10" fill="#fff2e8" stroke="#d6a27c" stroke-width="2"/>
