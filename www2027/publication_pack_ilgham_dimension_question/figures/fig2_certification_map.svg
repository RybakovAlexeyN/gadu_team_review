<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 790" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. Observed family-certification frequency across dimensions, gaps and feedback quality.</title>
<desc id="desc">Thirty-six E17 cells, six seeds each. Strong-gap q=.75 yields 6 of 6 certificates in all six layouts; strong-gap q=.35 totals 9 of 36; medium or near-tie none.</desc>
<rect width="1260" height="790" fill="#ffffff"/>
<text x="53" y="62" fill="#182d43" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Certification requires separation and usable feedback</text>
<text x="53" y="103" fill="#53687b" font-size="18" font-family="Arial,Helvetica,sans-serif">E17 • 6 seeds/cell • 6 dimension layouts × 3 gap regimes × 2 window probabilities (q)</text>
<text x="53" y="135" fill="#7b8795" font-size="16" font-family="Arial,Helvetica,sans-serif">Cell = number of issued correct family certificates out of 6 trials; grey = 0/6</text>
<line x1="53" y1="162" x2="1205" y2="162" stroke="#e0e6ed" stroke-width="2"/>
