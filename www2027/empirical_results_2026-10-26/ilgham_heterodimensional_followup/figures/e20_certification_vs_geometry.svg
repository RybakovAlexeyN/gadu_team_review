<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 465" role="img" aria-labelledby="title desc">
<title id="title">E20: certification helps a matched staged baseline, but direct geometry UCB has lower full regret</title>
<desc id="desc">d=2,3,4; big reward gap, q=0.75, T=20000; six matched seeds per policy. Horizontal bars: 1205.8 direct geometry-aware UCB; 1605.8 staged with certification and geometric Stage2; 4151.6 matched Stage1 without retirement. Lower regret is better.</desc>
<rect x="0" y="0" width="1040" height="465" fill="#ffffff" />
<text x="42" y="45" fill="#142b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">E20: family retirement helps, but Stage 1 still costs</text>
<text x="42" y="73" fill="#536477" font-family="Arial, Helvetica, sans-serif" font-size="15">d = (2, 3, 4) · strong gap · q = 0.75 · T = 20,000 · six matched seeds</text>
<text x="42" y="103" fill="#536477" font-family="Arial, Helvetica, sans-serif" font-size="14">Mean cumulative latent pseudo-regret (lower is better); independently authored surrogate, NOT author GADU-Cover</text>
<line x1="375.0" x2="375.0" y1="133" y2="336" stroke="#e4eaf0" stroke-width="1"/><text x="375.0" y="357" text-anchor="middle" fill="#6a7382" font-family="Arial, Helvetica, sans-serif" font-size="13">0</text><line x1="490.6" x2="490.6" y1="133" y2="336" stroke="#e4eaf0" stroke-width="1"/><text x="490.6" y="357" text-anchor="middle" fill="#6a7382" font-family="Arial, Helvetica, sans-serif" font-size="13">1,000</text><line x1="606.1" x2="606.1" y1="133" y2="336" stroke="#e4eaf0" stroke-width="1"/><text x="606.1" y="357" text-anchor="middle" fill="#6a7382" font-family="Arial, Helvetica, sans-serif" font-size="13">2,000</text><line x1="721.7" x2="721.7" y1="133" y2="336" stroke="#e4eaf0" stroke-width="1"/><text x="721.7" y="357" text-anchor="middle" fill="#6a7382" font-family="Arial, Helvetica, sans-serif" font-size="13">3,000</text><line x1="837.2" x2="837.2" y1="133" y2="336" stroke="#e4eaf0" stroke-width="1"/><text x="837.2" y="357" text-anchor="middle" fill="#6a7382" font-family="Arial, Helvetica, sans-serif" font-size="13">4,000</text><text x="42" y="184" fill="#213346" font-family="Arial, Helvetica, sans-serif" font-size="16">Direct geometry-aware UCB</text><rect x="375" y="161" width="139.3" height="35" rx="4" fill="#446995"/><text x="526.3" y="185" fill="#1b2b3a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1,205.8</text><text x="42" y="254" fill="#213346" font-family="Arial, Helvetica, sans-serif" font-size="16">Staged + certified family retirement</text><rect x="375" y="231" width="185.6" height="35" rx="4" fill="#2b8464"/><text x="572.6" y="255" fill="#1b2b3a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1,605.8</text><text x="42" y="324" fill="#213346" font-family="Arial, Helvetica, sans-serif" font-size="16">Same Stage 1, no retirement</text><rect x="375" y="301" width="479.7" height="35" rx="4" fill="#b8783e"/><text x="866.7" y="325" fill="#1b2b3a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">4,151.6</text><line x1="42" x2="998" y1="387" y2="387" stroke="#d9e1e8"/>
<text x="42" y="412" fill="#1b2b3a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Effect relative to same Stage 1 / no retirement: −61.3% regret</text>
<text x="42" y="438" fill="#536477" font-family="Arial, Helvetica, sans-serif" font-size="13">But staged + retirement remains +399.95 worse than direct geo-UCB (conditional six-seed 95% paired CI: +250.18 to +549.72).</text>
</svg>