name: Component benchmark smoke test

on:
  push:
    paths:
      - "experiments/**"
      - ".github/workflows/component-benchmark.yml"
  pull_request:
    paths:
      - "experiments/**"
      - ".github/workflows/component-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install numpy
      - run: python experiments/eval.py
